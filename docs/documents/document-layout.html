<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{DOCUMENT_TITLE}}</title>
<style>
  @page {
    size: A4;
    margin: 25mm 20mm 25mm 20mm;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 11pt;
    line-height: 1.6;
    color: #1a1a1a;
    background: #fff;
  }

  /* Title Page */
  .title-page {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    text-align: center;
    page-break-after: always;
  }

  .title-page .logo {
    max-width: 200px;
    max-height: 120px;
    margin-bottom: 40px;
  }

  .title-page h1 {
    font-size: 28pt;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 12px;
    letter-spacing: -0.5px;
  }

  .title-page .subtitle {
    font-size: 14pt;
    color: #555;
    margin-bottom: 40px;
  }

  .title-page .meta {
    font-size: 10pt;
    color: #888;
    line-height: 1.8;
  }

  /* Table of Contents */
  .toc {
    page-break-after: always;
  }

  .toc h2 {
    font-size: 18pt;
    margin-bottom: 20px;
    border-bottom: 2px solid #1a1a1a;
    padding-bottom: 8px;
  }

  .toc ul {
    list-style: none;
    padding: 0;
  }

  .toc li {
    padding: 6px 0;
    border-bottom: 1px dotted #ccc;
    font-size: 11pt;
  }

  .toc li.level-1 {
    font-weight: 600;
    padding-top: 12px;
  }

  .toc li.level-2 {
    padding-left: 20px;
    color: #444;
  }

  .toc li.level-3 {
    padding-left: 40px;
    font-size: 10pt;
    color: #666;
  }

  /* Chapter Headings */
  h1 {
    font-size: 22pt;
    font-weight: 700;
    color: #1a1a1a;
    margin-top: 0;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid #1a1a1a;
    page-break-before: always;
  }

  h1:first-of-type {
    page-break-before: avoid;
  }

  h2 {
    font-size: 16pt;
    font-weight: 600;
    color: #2a2a2a;
    margin-top: 28px;
    margin-bottom: 12px;
    padding-bottom: 4px;
    border-bottom: 1px solid #ddd;
  }

  h3 {
    font-size: 13pt;
    font-weight: 600;
    color: #333;
    margin-top: 20px;
    margin-bottom: 8px;
  }

  h4 {
    font-size: 11pt;
    font-weight: 600;
    color: #444;
    margin-top: 16px;
    margin-bottom: 6px;
  }

  /* Body Text */
  p {
    margin-bottom: 10px;
    text-align: justify;
    hyphens: auto;
  }

  /* Lists */
  ul, ol {
    margin: 8px 0 12px 24px;
  }

  li {
    margin-bottom: 4px;
  }

  /* Tables */
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 10pt;
    page-break-inside: avoid;
  }

  thead {
    background: #f5f5f5;
  }

  th {
    font-weight: 600;
    text-align: left;
    padding: 8px 12px;
    border: 1px solid #ddd;
  }

  td {
    padding: 6px 12px;
    border: 1px solid #ddd;
    vertical-align: top;
  }

  tr:nth-child(even) {
    background: #fafafa;
  }

  /* Code */
  code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 9.5pt;
    background: #f4f4f4;
    padding: 2px 5px;
    border-radius: 3px;
  }

  pre {
    background: #f4f4f4;
    border: 1px solid #e0e0e0;
    border-radius: 4px;
    padding: 14px 16px;
    margin: 12px 0;
    overflow-x: auto;
    font-size: 9pt;
    line-height: 1.5;
    page-break-inside: avoid;
  }

  pre code {
    background: none;
    padding: 0;
    border-radius: 0;
  }

  /* Blockquotes */
  blockquote {
    border-left: 3px solid #ccc;
    padding: 8px 16px;
    margin: 12px 0;
    color: #555;
    background: #fafafa;
    page-break-inside: avoid;
  }

  /* Alerts / Callouts */
  .callout {
    border-left: 4px solid #0969da;
    background: #f0f7ff;
    padding: 12px 16px;
    margin: 16px 0;
    border-radius: 0 4px 4px 0;
    page-break-inside: avoid;
  }

  .callout.warning {
    border-color: #d1242f;
    background: #fff5f5;
  }

  .callout.info {
    border-color: #0969da;
    background: #f0f7ff;
  }

  /* Horizontal Rule */
  hr {
    border: none;
    border-top: 1px solid #ddd;
    margin: 24px 0;
  }

  /* Links — styled for print */
  a {
    color: #0969da;
    text-decoration: none;
  }

  @media print {
    a[href^="http"]::after {
      content: " (" attr(href) ")";
      font-size: 8pt;
      color: #888;
    }
  }

  /* Page break utilities */
  .page-break {
    page-break-before: always;
  }

  .no-break {
    page-break-inside: avoid;
  }

  /* Footer */
  .document-footer {
    margin-top: 40px;
    padding-top: 12px;
    border-top: 1px solid #ddd;
    font-size: 9pt;
    color: #999;
    text-align: center;
  }
</style>
</head>
<body>

{{DOCUMENT_CONTENT}}

</body>
</html>
